server.port=8080
spring.application.name=codecompass
spring.jackson.serialization.indent_output=true
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=WARN
spring.ai.model.chat=none
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.2
codecompass.chat.max-message-characters=12000
codecompass.chat.max-context-messages=12
codecompass.chat.max-context-characters=24000
codecompass.chat.max-project-instruction-characters=4000

# Database configuration (Defaults to local persistent H2; override with SUPABASE_DB_* or DB_* for PostgreSQL / Supabase)
spring.datasource.url=${SUPABASE_DB_URL:${DB_URL:jdbc:h2:file:./data/codecompass;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SUPABASE_DB_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Optional Supabase project integration
codecompass.supabase.url=${SUPABASE_URL:}
codecompass.supabase.anon-key=${SUPABASE_ANON_KEY:}
codecompass.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
codecompass.supabase.secret-key=${SUPABASE_SECRET_KEY:}

# SMTP configuration for email verification and password reset
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_TIMEOUT:5000}

# CodeCompass email configuration
codecompass.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@localhost}}
codecompass.mail.dev-fallback=${MAIL_DEV_FALLBACK:false}
codecompass.app.base-url=${APP_BASE_URL:http://localhost:8080}

# For HTTPS deployments set SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
codecompass.auth.login.max-attempts=25
codecompass.auth.login.window-seconds=300
