# Supabase Session / Transaction Pooler (Port 5432 / 6543)
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.meebyywgudkxbpefqogs}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Supabase Project API & Realtime Credentials
codecompass.supabase.url=${SUPABASE_URL:https://meebyywgudkxbpefqogs.supabase.co}
codecompass.supabase.anon-key=${SUPABASE_ANON_KEY:}
codecompass.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
codecompass.supabase.secret-key=${SUPABASE_SECRET_KEY:}
